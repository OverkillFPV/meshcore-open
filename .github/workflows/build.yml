name: Build

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  android:
    if: github.event.release.target_commitish == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter pub get
      - run: flutter build apk --release --no-pub
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/meshcore-open-$TAG.apk"
          gh release upload "$TAG" "$RUNNER_TEMP/meshcore-open-$TAG.apk" --clobber

  ios:
    if: github.event.release.target_commitish == 'dev'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --no-pub
      - name: Upload unsigned iOS app to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd build/ios/iphoneos
          zip -qr "$RUNNER_TEMP/meshcore-open-$TAG-ios-unsigned.zip" *.app
          gh release upload "$TAG" "$RUNNER_TEMP/meshcore-open-$TAG-ios-unsigned.zip" --clobber

  linux:
    if: github.event.release.target_commitish == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Linux SDK pin
        id: linux-sdk
        run: echo "version=$(jq -r '.flutter.version' scripts/appimage-tools.json)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.linux-sdk.outputs.version }}
          cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config jq libgtk-3-dev librsvg2-dev libgirepository1.0-dev libgtk-3-bin libgdk-pixbuf2.0-bin libgdk-pixbuf-2.0-dev dpkg-dev patchelf file desktop-file-utils xdg-user-dirs shellcheck libssl-dev libunwind-dev libvulkan-dev libgl1-mesa-dev libasound2-dev libsecret-1-dev libgpg-error0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/meshcore-open/appimage
          key: linux-appimage-x86_64-${{ hashFiles('scripts/appimage-tools.json') }}
      - name: Test packaging contracts
        run: |
          shellcheck scripts/build_appimage.sh scripts/appimage/*.sh scripts/appimage/AppRun
          bash scripts/appimage/test_packaging.sh
      - run: flutter pub get
      - run: flutter build linux --release --no-pub
      - uses: docker/setup-buildx-action@v3
      - name: Read AppImage base image
        id: appimage-base
        run: echo "image=$(jq -r '.ubuntu' scripts/appimage-tools.json)" >> "$GITHUB_OUTPUT"
      - name: Build cached x86_64 runtime test image
        uses: docker/build-push-action@v6
        with:
          context: scripts
          file: scripts/appimage/Dockerfile
          target: runtime-test
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ steps.appimage-base.outputs.image }}
          tags: meshcore-appimage-runtime:ci
          cache-from: type=gha,scope=meshcore-appimage-runtime-amd64
          cache-to: type=gha,mode=max,scope=meshcore-appimage-runtime-amd64
          load: true
      - name: Test AppImage in clean Ubuntu
        run: |
          mkdir -p build/appimage-runtime
          docker run --rm --stop-timeout 15 --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD/build/linux/x64/release/meshcore-open-x86_64.AppImage,target=/artifact.AppImage,readonly" --mount "type=bind,source=$PWD/scripts/appimage/test_runtime.sh,target=/test_runtime.sh,readonly" --mount "type=bind,source=$PWD/scripts/appimage/dependencies.sh,target=/dependencies.sh,readonly" --mount "type=bind,source=$PWD/build/appimage-runtime,target=/results" meshcore-appimage-runtime:ci env MESHCORE_APPIMAGE_DEPENDENCIES=/dependencies.sh timeout --verbose --signal=TERM --kill-after=15s 300s xvfb-run -a bash /test_runtime.sh /artifact.AppImage /results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x86_64-appimage
          path: |
            build/linux/x64/release/meshcore-open-x86_64.AppImage
            build/linux/x64/release/appimage-audit.txt
            build/linux/x64/release/appimage-tools.json
            build/appimage-runtime/
          if-no-files-found: warn
      - name: Upload AppImage to release
        if: always() && hashFiles('build/linux/x64/release/meshcore-open-x86_64.AppImage') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" build/linux/x64/release/meshcore-open-x86_64.AppImage --clobber

  linux-arm64:
    if: github.event.release.target_commitish == 'dev'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter source pin
        id: flutter-arm
        run: echo "revision=$(jq -r '.flutter.source_revision' scripts/appimage-tools.json)" >> "$GITHUB_OUTPUT"
      - name: Set up pinned native Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: main
          flutter-version: ${{ steps.flutter-arm.outputs.revision }}
          architecture: arm64
          git-source: https://github.com/flutter/flutter.git
          cache: true
      - name: Verify native ARM64 Flutter
        env:
          FLUTTER_REVISION: ${{ steps.flutter-arm.outputs.revision }}
        run: |
          test "$(uname -m)" = aarch64
          mkdir -p build
          flutter --version
          flutter --version --machine > build/flutter-version.json
          jq -e --arg revision "$FLUTTER_REVISION" --arg version "$(jq -r '.flutter.version' scripts/appimage-tools.json)" '.frameworkVersion == $version and .frameworkRevision == $revision' build/flutter-version.json
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config jq libgtk-3-dev librsvg2-dev libgirepository1.0-dev libgtk-3-bin libgdk-pixbuf2.0-bin libgdk-pixbuf-2.0-dev dpkg-dev patchelf file desktop-file-utils xdg-user-dirs shellcheck libssl-dev libunwind-dev libvulkan-dev libgl1-mesa-dev libasound2-dev libsecret-1-dev libgpg-error0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/meshcore-open/appimage
          key: linux-appimage-aarch64-${{ hashFiles('scripts/appimage-tools.json') }}
      - name: Test packaging contracts
        run: |
          shellcheck scripts/build_appimage.sh scripts/appimage/*.sh scripts/appimage/AppRun
          bash scripts/appimage/test_packaging.sh
      - run: flutter pub get
      - run: flutter test --reporter expanded
      - name: Build ARM64 Linux release
        run: |
          if ! flutter build linux --release --no-pub --verbose > build/linux-arm64-build.log 2>&1; then
            tail -n 200 build/linux-arm64-build.log
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Read AppImage base image
        id: appimage-base
        run: echo "image=$(jq -r '.ubuntu' scripts/appimage-tools.json)" >> "$GITHUB_OUTPUT"
      - name: Build cached ARM64 runtime test image
        uses: docker/build-push-action@v6
        with:
          context: scripts
          file: scripts/appimage/Dockerfile
          target: runtime-test
          platforms: linux/arm64
          build-args: |
            BASE_IMAGE=${{ steps.appimage-base.outputs.image }}
          tags: meshcore-appimage-runtime-arm64:ci
          cache-from: type=gha,scope=meshcore-appimage-runtime-arm64
          cache-to: type=gha,mode=max,scope=meshcore-appimage-runtime-arm64
          load: true
      - name: Test ARM64 AppImage in clean Ubuntu
        run: |
          mkdir -p build/appimage-runtime
          docker run --rm --stop-timeout 15 --platform linux/arm64 --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD/build/linux/arm64/release/meshcore-open-aarch64.AppImage,target=/artifact.AppImage,readonly" --mount "type=bind,source=$PWD/scripts/appimage/test_runtime.sh,target=/test_runtime.sh,readonly" --mount "type=bind,source=$PWD/scripts/appimage/dependencies.sh,target=/dependencies.sh,readonly" --mount "type=bind,source=$PWD/build/appimage-runtime,target=/results" meshcore-appimage-runtime-arm64:ci env MESHCORE_APPIMAGE_DEPENDENCIES=/dependencies.sh timeout --verbose --signal=TERM --kill-after=15s 300s xvfb-run -a bash /test_runtime.sh /artifact.AppImage /results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-appimage
          path: |
            build/linux/arm64/release/meshcore-open-aarch64.AppImage
            build/linux/arm64/release/appimage-audit.txt
            build/linux/arm64/release/appimage-tools.json
            build/flutter-version.json
            build/appimage-runtime/
            build/linux-arm64-build.log
          if-no-files-found: warn
      - name: Upload AppImage to release
        if: always() && hashFiles('build/linux/arm64/release/meshcore-open-aarch64.AppImage') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" build/linux/arm64/release/meshcore-open-aarch64.AppImage --clobber

  macos:
    if: github.event.release.target_commitish == 'dev'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --no-pub
      - name: Upload macOS app to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd build/macos/Build/Products/Release
          zip -qry "$RUNNER_TEMP/meshcore-open-$TAG-macos.zip" meshcore_open*.app
          gh release upload "$TAG" "$RUNNER_TEMP/meshcore-open-$TAG-macos.zip" --clobber

  web:
    if: github.event.release.target_commitish == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-pub
      - name: Upload web build to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd build/web
          zip -qr "$RUNNER_TEMP/meshcore-open-$TAG-web.zip" .
          gh release upload "$TAG" "$RUNNER_TEMP/meshcore-open-$TAG-web.zip" --clobber
